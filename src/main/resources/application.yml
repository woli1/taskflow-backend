spring:
  application:
    name: taskflow-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:liquibase/changelog-master.xml


app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health

---
# Profil dev : base H2 en mémoire, aucun prérequis
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hiberante:
      ddl-auto: none




---
# Profil prod (Azure) : tout vient des variables d'environnement
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
