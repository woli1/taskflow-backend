# Test "type production" en local : API + PostgreSQL
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      JWT_SECRET: change-me-use-a-long-random-secret-at-least-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:4200

volumes:
  pgdata:
